<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>收工倒數器</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    .app-header {
      text-align: center;
      padding: 12px 0 20px;
    }

    .app-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #34d399, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Hero Countdown Section */
    .countdown-label {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .countdown-display {
      font-size: 46px;
      font-weight: 900;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      letter-spacing: 2px;
      margin: 4px 0 12px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 30px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      font-size: 15px;
      font-weight: 700;
    }

    /* Live Earning Section */
    .earning-section {
      width: 100%;
    }

    .earning-title {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .earning-amount {
      font-size: 38px;
      font-weight: 900;
      font-family: 'Consolas', 'Courier New', monospace;
      color: var(--accent-gold);
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
      margin-bottom: 16px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .metric-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .metric-name {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Goal Section */
    .goal-card {
      align-items: stretch;
      text-align: left;
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .goal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .goal-cost {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .progress-track {
      background: rgba(15, 23, 42, 0.8);
      height: 18px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      border-radius: 10px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .goal-footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Fixed Bottom Action Bar */
    .bottom-action-bar {
      margin-top: auto;
      padding-top: 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }

    .btn-primary-large {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s active;
    }

    .btn-primary-large:active {
      transform: scale(0.98);
    }

    /* Mobile Drawer / Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .drawer-card {
      background: #1e293b;
      width: 100%;
      max-width: 500px;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px 20px 32px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .drawer-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .input-control {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 16px;
      outline: none;
      width: 100%;
    }

    .input-control:focus {
      border-color: var(--accent-green);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 16px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-green);
    }

    .checkbox-row label {
      font-size: 15px;
      color: var(--text-main);
    }

    .btn-save-drawer {
      width: 100%;
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top App Header -->
  <div class="app-header">
    <h1 class="app-title">收工倒數器</h1>
  </div>

  <!-- Main Display Body -->
  <div class="main-content">

    <!-- Card 1: Countdown Hero -->
    <div class="glass-card">
      <div class="countdown-label">距下班還有</div>
      <div class="countdown-display" id="display-countdown">00:00:00</div>
      <div class="status-badge" id="display-status">🟢 努力摸魚賺錢中</div>
    </div>

    <!-- Card 2: Live Salary Tracker -->
    <div class="glass-card earning-section">
      <div class="earning-title">今日累計已賺</div>
      <div class="earning-amount" id="display-today-earned">$ 0.0000</div>

      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-name">每秒入帳</div>
          <div class="metric-val" id="display-sec-rate">$ 0.0000</div>
        </div>
        <div class="metric-box">
          <div class="metric-name">折算時薪</div>
          <div class="metric-val" id="display-hourly-rate">$ 0.00</div>
        </div>
      </div>
    </div>

    <!-- Card 3: Single Wish Goal -->
    <div class="glass-card goal-card">
      <div class="goal-header">
        <span class="goal-title" id="display-goal-name">🎯 AirPods Pro 2</span>
        <span class="goal-cost" id="display-goal-cost">$ 1,899</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="goal-progress-fill"></div>
      </div>
      <div class="goal-footer">
        <span id="display-goal-pct">進度 0.0%</span>
        <span id="display-goal-left-hours">還需打工 0 小時</span>
      </div>
    </div>

  </div>

  <!-- Bottom Single Action Bar -->
  <div class="bottom-action-bar">
    <button class="btn-primary-large" onclick="openDrawer()">
      ⚙️ 薪金設定
    </button>
  </div>

  <!-- Settings Drawer / Modal -->
  <div class="modal-backdrop" id="settingsDrawer">
    <div class="drawer-card">
      <div class="drawer-header">
        <div class="drawer-title">⚙️ 薪金與工時設定</div>
        <button class="btn-close" onclick="closeDrawer()">✕</button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>月薪 (元)</label>
          <input type="number" class="input-control" id="inputSalary" value="15000">
        </div>
        <div class="form-group">
          <label>每月工作天數</label>
          <input type="number" class="input-control" id="inputWorkDays" value="21.75" step="0.25">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>上班時間</label>
          <input type="time" class="input-control" id="inputWorkStart" value="09:00">
        </div>
        <div class="form-group">
          <label>下班時間</label>
          <input type="time" class="input-control" id="inputWorkEnd" value="18:00">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>午休開始</label>
          <input type="time" class="input-control" id="inputLunchStart" value="12:00">
        </div>
        <div class="form-group">
          <label>午休結束</label>
          <input type="time" class="input-control" id="inputLunchEnd" value="13:30">
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="inputPaidLunch">
        <label for="inputPaidLunch">午休時間算薪水 (帶薪午休)</label>
      </div>

      <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 12px 0;">

      <div class="form-row">
        <div class="form-group">
          <label>願望目標名稱</label>
          <input type="text" class="input-control" id="inputGoalName" value="AirPods Pro 2">
        </div>
        <div class="form-group">
          <label>目標金額 (元)</label>
          <input type="number" class="input-control" id="inputGoalCost" value="1899">
        </div>
      </div>

      <button class="btn-save-drawer" onclick="saveSettings()">儲存並生效</button>
    </div>
  </div>

  <script>
    // System Config Model
    let config = {
      salary: 15000,
      workDays: 21.75,
      workStart: "09:00",
      workEnd: "18:00",
      lunchStart: "13:00",
      lunchEnd: "14:00",
      paidLunch: false,
      goalName: "AirPods Pro 2",
      goalCost: 2000
    };

    function loadConfig() {
      const saved = localStorage.getItem('shougong_config');
      if (saved) {
        try {
          config = { ...config, ...JSON.parse(saved) };
        } catch(e){}
      }
      syncDrawerInputs();
    }

    function syncDrawerInputs() {
      document.getElementById('inputSalary').value = config.salary;
      document.getElementById('inputWorkDays').value = config.workDays;
      document.getElementById('inputWorkStart').value = config.workStart;
      document.getElementById('inputWorkEnd').value = config.workEnd;
      document.getElementById('inputLunchStart').value = config.lunchStart;
      document.getElementById('inputLunchEnd').value = config.lunchEnd;
      document.getElementById('inputPaidLunch').checked = config.paidLunch;
      document.getElementById('inputGoalName').value = config.goalName;
      document.getElementById('inputGoalCost').value = config.goalCost;
    }

    function openDrawer() {
      syncDrawerInputs();
      document.getElementById('settingsDrawer').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('settingsDrawer').classList.remove('active');
    }

    function saveSettings() {
      config.salary = parseFloat(document.getElementById('inputSalary').value) || 0;
      config.workDays = parseFloat(document.getElementById('inputWorkDays').value) || 21.75;
      config.workStart = document.getElementById('inputWorkStart').value || "09:00";
      config.workEnd = document.getElementById('inputWorkEnd').value || "18:00";
      config.lunchStart = document.getElementById('inputLunchStart').value || "12:00";
      config.lunchEnd = document.getElementById('inputLunchEnd').value || "13:30";
      config.paidLunch = document.getElementById('inputPaidLunch').checked;
      config.goalName = document.getElementById('inputGoalName').value || "願望目標";
      config.goalCost = parseFloat(document.getElementById('inputGoalCost').value) || 0;

      localStorage.setItem('shougong_config', JSON.stringify(config));
      closeDrawer();
      updateCalculator();
    }

    function parseTimeToSeconds(timeStr) {
      const parts = timeStr.split(':').map(Number);
      return parts[0] * 3600 + parts[1] * 60;
    }

    function formatMoney(num, decimals = 2) {
      return '$ ' + num.toLocaleString('zh-CN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function formatSeconds(secs) {
      const h = Math.floor(secs / 3600).toString().padStart(2, '0');
      const m = Math.floor((secs % 3600) / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function updateCalculator() {
      const now = new Date();
      const currentSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      const startSecs = parseTimeToSeconds(config.workStart);
      const endSecs = parseTimeToSeconds(config.workEnd);
      const lunchStartSecs = parseTimeToSeconds(config.lunchStart);
      const lunchEndSecs = parseTimeToSeconds(config.lunchEnd);

      let grossWorkSecs = Math.max(0, endSecs - startSecs);
      let lunchDurationSecs = Math.max(0, lunchEndSecs - lunchStartSecs);
      let netWorkSecs = config.paidLunch ? grossWorkSecs : Math.max(1, grossWorkSecs - lunchDurationSecs);

      const dailyRate = config.salary / config.workDays;
      const hourlyRate = dailyRate / (netWorkSecs / 3600);
      const secRate = dailyRate / netWorkSecs;

      let workedSecs = 0;
      let statusText = "";
      let countdownSecs = 0;

      if (currentSecs < startSecs) {
        statusText = "⏰ 未到上班時間";
        workedSecs = 0;
        countdownSecs = endSecs - currentSecs;
      } else if (currentSecs >= endSecs) {
        statusText = "🎉 已到收工時間";
        workedSecs = netWorkSecs;
        countdownSecs = 0;
      } else {
        countdownSecs = Math.max(0, endSecs - currentSecs);
        if (!config.paidLunch && currentSecs >= lunchStartSecs && currentSecs < lunchEndSecs) {
          statusText = "🍱 午休中 (暫停計薪)";
          workedSecs = lunchStartSecs - startSecs;
        } else {
          statusText = "🟢 努力摸魚賺錢中";
          let elapsedTotal = currentSecs - startSecs;
          if (!config.paidLunch && currentSecs >= lunchEndSecs) {
            workedSecs = elapsedTotal - lunchDurationSecs;
          } else {
            workedSecs = elapsedTotal;
          }
        }
      }

      workedSecs = Math.max(0, Math.min(workedSecs, netWorkSecs));
      const todayEarned = workedSecs * secRate;

      // Render Display
      document.getElementById('display-countdown').innerText = formatSeconds(countdownSecs);
      document.getElementById('display-status').innerText = statusText;
      document.getElementById('display-today-earned').innerText = formatMoney(todayEarned, 4);
      document.getElementById('display-sec-rate').innerText = formatMoney(secRate, 4);
      document.getElementById('display-hourly-rate').innerText = formatMoney(hourlyRate, 2);

      // Wish Goal Calculation
      document.getElementById('display-goal-name').innerText = '🎯 ' + config.goalName;
      document.getElementById('display-goal-cost').innerText = formatMoney(config.goalCost, 0);

      const goalPct = config.goalCost > 0 ? Math.min(100, (todayEarned / config.goalCost) * 100) : 100;
      document.getElementById('goal-progress-fill').style.width = goalPct.toFixed(1) + '%';
      document.getElementById('display-goal-pct').innerText = `進度 ${goalPct.toFixed(1)}%`;

      const remainCost = Math.max(0, config.goalCost - todayEarned);
      const remainHours = hourlyRate > 0 ? (remainCost / hourlyRate) : 0;
      document.getElementById('display-goal-left-hours').innerText = remainHours > 0 ? `還需打工 ${remainHours.toFixed(1)} 小時` : '🎉 已成功解鎖！';
    }

    loadConfig();
    updateCalculator();
    setInterval(updateCalculator, 1000);
  </script>
</body>
</html>
